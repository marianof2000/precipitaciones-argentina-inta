[project]
name = "precipitaciones-argentina"
version = "0.1.0"
description = "ETL y visualización geoespacial y temporal de precipitaciones en Argentina"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "folium>=0.20",
    "geopandas>=1.1",
    "numpy>=2.3",
    "openpyxl>=3.1",
    "pandas>=2.3",
    "pillow>=11.3",
    "pyarrow>=21",
    "scipy>=1.16",
    "xlrd>=2.0",
]

[project.scripts]
precipitaciones = "precipitaciones_argentina.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
]

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
